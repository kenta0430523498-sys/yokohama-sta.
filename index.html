<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>駅模型</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body {
margin: 0;
background: white;
overflow: hidden;
}

model-viewer {
width: 100vw;
height: 100vh;
}

.hotspot {
background: rgba(255,255,255,0.9);
padding: 6px 10px;
border-radius: 8px;
font-family: sans-serif;
font-size: 14px;
border: none;
cursor: pointer;
box-shadow: 0 0 6px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<model-viewer
src="howtomake_JO13.glb"
camera-controls
auto-rotate
shadow-intensity="1"
environment-image="neutral">

<!-- V字 -->
<button
class="hotspot"
slot="hotspot-1"
data-position="60.6m 22m 25m"
data-normal="60.6m 22m 25m">
1 既存 屋根支え V字
</button>

<!-- 既存柱 -->
<button
class="hotspot"
slot="hotspot-2"
data-position="81.5m 20.3m 25.1m"
data-normal="81.5m 20.3m 25.1m">
2 既存柱
</button>

<!-- 既存 柱間梁 -->
<button
class="hotspot"
slot="hotspot-3"
data-position="-24m -20.1m 31.5m"
data-normal="-24m -20.1m 31.5m">
3 既存 柱間梁
</button>
  
<!-- 既存 通し梁 -->
<button
class="hotspot"
slot="hotspot-4"
data-position="47m 23.35m 25.1m"
data-normal="47m 23.35m 25.1m">
4 既存 通し梁
</button>

<!-- X座標 -->
<button
class="hotspot"
slot="hotspot-5"
data-position="50m 0m 0m"
data-normal="50m 0m 0m">
5 Xに５０
</button>

<!-- Y座標 -->
<button
class="hotspot"
slot="hotspot-6"
data-position="0m 50m 0m"
data-normal="0m 50m 0m">
6 Yに５０
</button>

<!-- Z座標 -->
<button
class="hotspot"
slot="hotspot-7"
data-position="0m 0m 50m"
data-normal="0m 0m 50m">
7 Zに５０
</button>
  
</model-viewer>

</body>

</html>
